<header>
 <app-header/> 
</header>
<main>
  <ul id="users">
   @for (user of users; track user.id){

    <li>
      <app-user [user]="user" [selected]="user.id===selectedUserId" (select)="onSelectUser($event)">

      </app-user>
    </li>
   }
  </ul>

  @if(selectedUser){
  <app-tasks [userId]="selectedUser.id" [name]=" selectedUser.name" />
  }
  @else {
    <p
    id="fallback">select a user to see their tasks</p>
  }
  <button (click)="onAddNewUser()"> Add New User</button>
 
  @if(isNewUser){
    <app-new-user (close)="OncancelAddNewUser()"></app-new-user>
  }
</main>
